<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Waste Donation</title>
    <style>
        body {
            background-color: #55C595;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        fieldset {
            background-color: #2a9d8f;
            border: none;
            border-radius: 15px;
            padding: 40px 30px;
            width: 450px;
            box-shadow: 0px 0px 15px rgba(0, 0, 0, 0.3);
            position: relative;
        }

        .header {
            background-color: #f4a261;
            color: #264653;
            text-align: center;
            font-size: 1.8rem;
            padding: 20px;
            border-radius: 15px 15px 0 0;
            position: absolute;
            top: -40px;
            left: 0;
            width: 100%;
            box-sizing: border-box;
            font-weight: bold;
        }

        table {
            width: 100%;
            margin-top: 40px;
        }

        td {
            padding: 12px;
        }

        input, select {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background-color: #edf6f9;
            box-shadow: inset 0px 0px 5px rgba(0, 0, 0, 0.1);
            font-size: 1rem;
            color: #264653;
        }

        input:focus, select:focus {
            outline: none;
            box-shadow: 0px 0px 5px rgba(0, 0, 0, 0.3);
        }

        .btn {
            width: 100%;
            padding: 15px;
            background-color: #e76f51;
            color: #fff;
            border: none;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease, transform 0.3s ease;
            margin-top: 25px;
        }

        .btn:hover {
            background-color: #f4a261;
            transform: scale(1.05);
        }

        #thankYouMessage {
            display: none;
            text-align: center;
            margin-top: 25px;
            font-size: 1.5rem;
            color: black;
            font-family: 'Courier New', Courier, monospace;
        }

        #functionalCheckbox {
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-label {
            display: flex;
            align-items: center;
            font-size: 1.1rem;
            color: #fff;
        }

        td:first-child {
            font-weight: bold;
            font-size: 1rem;
            color: #f0efeb;
        }
    </style>
</head>

<body>
    <fieldset>
        <div class="header">Donate Your E-Waste</div>
        <legend>
            <h3 style="color: #edf6f9;">Fill in the Details</h3>
        </legend>
        <table>
            <tr>
                <td>Name:</td>
                <td><input type="text" id="Name" placeholder="Enter your name" required></td>
            </tr>
            <tr>
                <td>Address:</td>
                <td><input type="text" id="Address" placeholder="Enter your address" required></td>
            </tr>
            <tr>
                <td>Product:</td>
                <td><input type="text" id="Product" placeholder="Enter product name" required></td>
            </tr>
            <tr>
                <td>E-Waste Type:</td>
                <td>
                    <select id="eWasteType" required>
                        <option value="">Select Type</option>
                        <option value="Electronics">Electronics</option>
                        <option value="Appliances">Household Appliances</option>
                        <option value="Batteries">Batteries & Cables</option>
                        <option value="Peripherals">Computer Peripherals</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Usage:</td>
                <td><input type="text" id="Usage" placeholder="Enter usage duration"></td>
            </tr>
            <tr>
                <td>Condition:</td>
                <td><input type="text" id="Condition" placeholder="Enter product condition"></td>
            </tr>
            <tr>
                <td>Weight (in kg):</td>
                <td><input type="number" id="Weight" min="0" step="0.1" placeholder="Enter weight"></td>
            </tr>
            <tr>
                <td>Pickup Date:</td>
                <td><input type="date" id="datepicker" required></td>
            </tr>
            <tr>
                <td>Pickup Time Slot:</td>
                <td>
                    <select id="pickupTimeSlot" required>
                        <option value="Morning">Morning (9 AM - 12 PM)</option>
                        <option value="Afternoon">Afternoon (12 PM - 4 PM)</option>
                        <option value="Evening">Evening (4 PM - 8 PM)</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>Upload Image:</td>
                <td><input type="file" id="ProductImage" accept="image/*"></td>
            </tr>
            <tr>
                <td>Is the product functional?</td>
                <td class="checkbox-label">
                    <input type="checkbox" id="functionalCheckbox">
                    <label for="functionalCheckbox">Functional</label>
                </td>
            </tr>
        </table>
        <button id="btn" class="btn">SUBMIT</button>
        <div id="thankYouMessage">Thank You for your Donation!</div>
    </fieldset>

    <script>
        document.getElementById('btn').addEventListener('click', function () {
            const name = document.getElementById('Name').value;
            const product = document.getElementById('Product').value;
            const date = document.getElementById('datepicker').value;
            const timeSlot = document.getElementById('pickupTimeSlot').value;
            const isFunctional = document.getElementById('functionalCheckbox').checked;

            if (name && product && date) {
                const fileInput = document.getElementById('ProductImage');
                if (fileInput.files.length > 0 && fileInput.files[0].type.startsWith('image/')) {
                    document.getElementById('thankYouMessage').style.display = 'block';
                    document.getElementById('thankYouMessage').innerText =
                        `Thank you, ${name}, for donating your ${product}. Pickup is scheduled on ${date} (${timeSlot}).` +
                        (isFunctional ? ' Your product is marked as functional.' : ' Your product is marked as not functional.');
                } else {
                    alert('Please upload a valid image file.');
                }
            } else {
                alert('Please fill out all required fields.');
            }
        });
    </script>
</body>

</html>
